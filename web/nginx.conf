server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 400m;   # demo video uploads go through /api/demo/upload
  location /api/ { proxy_pass http://api:8000; }
  location /ws/  { proxy_pass http://api:8000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 3600; }
  location / { try_files $uri /index.html; }
}
