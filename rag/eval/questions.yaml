# Hand-written RAG evaluation set (ADR-0004: "20 hand-verified questions, source hit-rate + correctness").
# Every expectation was checked by hand against rag/corpus/*.md on 2026-09-02. Fields:
#   q / lang            question and answer language (retrieval prefers chunks in that language)
#   expect_doc          the corpus file that must appear among the cited sources
#   expect_section      (optional) the heading that must appear among the cited sources
#   must_contain        (optional) at least ONE of these regexes must appear in the answer (case-insensitive)
#   kind                corpus | refuse | inventory
#     refuse    → the corpus has no answer; the model must decline instead of inventing a rule
#     inventory → the answer must cite `live-inventory` and quote the real count from the database
- {id: 1,  kind: corpus, lang: de, q: "Wohin mit PLA-Fehldrucken?", expect_doc: kunststoffe_3d_druck.de.md, expect_section: PLA, must_contain: ["Restmüll", "Filament-Recycler"]}
- {id: 2,  kind: corpus, lang: de, q: "Kann ich PETG-Drucke in den Gelben Sack werfen?", expect_doc: kunststoffe_3d_druck.de.md, must_contain: ["Verpackung"]}
