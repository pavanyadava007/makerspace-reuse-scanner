name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: mrs, POSTGRES_PASSWORD: mrs, POSTGRES_DB: mrs }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U mrs" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff -r api/requirements.txt
      - run: ruff check api edge training vlm rag scripts
      - run: cd api && alembic upgrade head && pytest -q
        env: { DATABASE_URL: postgresql+psycopg://mrs:mrs@localhost:5432/mrs }
      - run: docker compose -f docker-compose.yml build api web   # image build must stay green (root build context)
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd web && npm ci && npm run build
  edge-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install numpy pyyaml pytest && cd edge && pytest -q
